name: Build and Deploy Spring Boot to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # Job 1: Build Docker Image và Push lên GitHub Container Registry (GHCR)
  # ========================================================
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chuẩn hóa tên Docker Image (Chữ thường)
        run: |
          # Docker yêu cầu toàn bộ tên registry & repository phải là chữ thường
          RAW_OWNER="${{ github.actor }}"
          LOWER_OWNER=$(echo "$RAW_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${LOWER_OWNER}/app:latest" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=ghcr.io/${LOWER_OWNER}/app:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build và Push Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_TAG_SHA }}

  # ========================================================
  # Job 2: Triển khai lên máy chủ VPS từ xa qua SSH
  # Nối sau Job build-image (chỉ chạy khi build thành công)
  # ========================================================
  deploy-vps:
    name: Deploy to Remote VPS via SSH
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Thực thi câu lệnh triển khai trên VPS qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=========================================================="
            echo "🚀 [VPS] BẮT ĐẦU TRIỂN KHAI ỨNG DỤNG LÊN CONTAINER"
            echo "=========================================================="

            # 1. Đăng nhập GHCR trên VPS bằng GITHUB_TOKEN
            echo "🔑 1. Đăng nhập vào GHCR trên VPS..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Chuẩn hóa tên image thành chữ thường
            IMAGE="ghcr.io/$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')/app:latest"

            # 2. Kéo Image mới nhất từ GHCR
            echo "📥 2. Kéo Docker image mới nhất: $IMAGE..."
            docker pull $IMAGE

            # 3. Khởi chạy lại container app
            echo "🔄 3. Dừng và xóa container cũ (nếu đang chạy)..."
            docker stop app || true && docker rm app || true && docker run -d \
              --name app \
              --restart unless-stopped \
              -p 8080:8080 \
              $IMAGE

            # 4. Kiểm tra trạng thái container và health endpoint
            echo "🩺 4. Kiểm tra trạng thái hoạt động của Container:"
            sleep 3
            docker ps -f name=app

            echo "=========================================================="
            echo "✅ [VPS] TRIỂN KHAI THÀNH CÔNG! SẴN SÀNG PHỤC VỤ TẠI CỔNG 8080"
            echo "=========================================================="
